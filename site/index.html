<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>下载 Goose</title>
    <meta name="description" content="下载 Goose 桌面版。页面会读取最新发布的版本。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f7;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --line: rgba(0, 0, 0, 0.08);
        --card: #ffffff;
        --fill: #1d1d1f;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; min-height: 100%; }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(1080px, calc(100% - 48px));
        margin: 0 auto;
        padding: 72px 0 88px;
      }

      .mark {
        width: 64px;
        height: 64px;
        display: block;
      }

      h1 {
        margin: 28px 0 0;
        font-size: 56px;
        line-height: 1.05;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .lede {
        margin: 14px 0 0;
        max-width: 36rem;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.45;
      }

      .version {
        margin: 22px 0 0;
        min-height: 28px;
        color: var(--ink);
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }

      .version span { color: var(--muted); }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 48px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 28px 24px 24px;
        display: flex;
        flex-direction: column;
        min-height: 248px;
      }

      .card h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .detail {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .badge {
        display: none;
        margin-top: 14px;
        width: fit-content;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f5f5f7;
        color: var(--ink);
        font-size: 12px;
        letter-spacing: 0.01em;
      }

      .card.recommended .badge { display: inline-flex; }

      .meta {
        margin-top: auto;
        padding-top: 28px;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      a.download {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        border: 1px solid var(--fill);
        color: var(--fill);
        background: transparent;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .card.recommended a.download,
      a.download:hover {
        background: var(--fill);
        color: #fff;
      }

      a.download:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .status {
        margin-top: 48px;
        color: var(--muted);
        font-size: 17px;
      }

      footer {
        margin-top: 56px;
        color: var(--muted);
        font-size: 13px;
      }

      .skeleton {
        height: 14px;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, #eee 0%, #f7f7f8 50%, #eee 100%);
        background-size: 200% 100%;
        animation: shine 1.2s ease-in-out infinite;
      }

      .skeleton.wide { width: 70%; margin-top: 12px; }

      @keyframes shine {
        0% { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }

      @media (max-width: 800px) {
        main { width: min(1080px, calc(100% - 32px)); padding-top: 40px; }
        h1 { font-size: 40px; }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 2048 2048" aria-hidden="true">
        <rect x="200" y="200" width="1648" height="1648" rx="400" fill="#1d1d1f" />
        <g transform="translate(128, 94) scale(3)" fill="#fff">
          <path d="M455.145 485.687C473.786 481.639 493.559 470.622 493.559 470.622L458.952 442.115C441.844 428.034 427.282 411.116 415.898 392.108C400.167 365.845 378.431 343.683 352.485 327.445L339.813 320.066C335.471 317.048 332.444 312.344 332.013 307.037C331.737 303.615 332.557 300.556 334.47 297.864C341.068 288.564 375.172 248.097 381.422 242.926C389.471 236.273 398.44 230.739 406.761 224.403C407.944 223.501 409.131 222.604 410.3 221.689C410.341 221.648 410.4 221.616 410.436 221.58C413.106 219.472 415.626 217.233 417.629 214.578C424.862 206.202 426.62 198.797 427.051 195.52C426.072 192.366 423.153 185.314 415.018 177.179C420.117 177.492 426.29 181.525 431.887 186.27C435.644 180.265 439.578 173.92 443.507 167.562C446.131 163.315 442.238 160.138 442.129 160.039L442.107 160.034C442.107 160.034 442.107 160.016 442.102 160.012C442.002 159.903 438.825 156.01 434.588 158.634C425.528 164.24 416.473 169.851 408.42 174.949C408.42 174.949 398.875 174.75 387.572 184.512C384.912 186.52 382.673 189.039 380.57 191.704C380.529 191.745 380.493 191.799 380.461 191.84C379.541 193.005 378.644 194.192 377.747 195.38C371.406 203.705 365.877 212.67 359.224 220.719C354.057 226.973 313.586 261.072 304.286 267.671C301.594 269.584 298.539 270.408 295.113 270.127C289.811 269.701 285.102 266.669 282.083 262.328L274.705 249.656C258.467 223.701 236.305 201.974 210.042 186.243C191.034 174.859 174.12 160.292 160.035 143.188L131.519 108.581C131.519 108.581 120.497 128.35 116.454 146.995C122.078 153.834 136.749 170.807 153.826 183.769C135.466 175.135 121.893 168.459 111.188 162.876C109.538 175.085 110.182 193.549 111.881 207.848C123.47 212.919 143.202 220.732 163.289 224.884C147.222 228.641 129.597 229.325 115.987 229.058C118.385 237.909 121.72 246.937 126.207 256.019C128.115 260.22 130.204 264.322 132.461 268.337C139.663 270.318 167.939 274.437 182.985 271.056C168.016 276.4 142.885 285.378 142.885 285.378C162.187 309.393 183.52 328.931 183.52 328.931C215.969 311.483 223.366 309.099 247.703 293.182C208.292 325.251 198.063 338.344 187 351.8L179.291 362.618C175.285 368.238 171.809 374.207 168.904 380.465C159.183 401.381 145.423 445.949 145.423 445.949C142.967 453.717 148.659 459.41 156.2 456.727C156.2 456.727 200.76 442.967 221.684 433.246C227.939 430.336 233.917 426.86 239.532 422.858L250.35 415.149C253.98 412.163 257.588 409.235 261.549 405.782C261.549 405.782 288.782 438.045 316.776 459.269C316.776 459.269 325.755 434.139 331.098 419.169C327.712 434.22 331.832 462.496 333.817 469.693C337.823 471.95 341.934 474.039 346.135 475.947C355.222 480.438 364.245 483.77 373.097 486.167C372.834 472.553 373.514 454.932 377.271 438.866C381.422 458.952 389.231 478.689 394.307 490.273C408.605 491.973 427.069 492.616 439.279 490.966C433.695 480.262 427.019 466.679 418.386 448.329C431.347 465.406 448.32 480.076 455.159 485.7L455.145 485.687Z" />
        </g>
      </svg>
      <h1>下载 Goose</h1>
      <p class="lede">桌面版安装包。每次打开都会读取当前发布的版本。</p>
      <p class="version" id="version"><span>正在读取版本…</span></p>
      <section class="grid" id="downloads" aria-live="polite"></section>
      <footer>安装包由构建发布到这个站点。应用内更新使用同一份版本清单。</footer>
    </main>
    <script>
      const editions = [
        { key: "win32-x64", title: "Windows", detail: "64 位" },
        { key: "darwin-arm64", title: "Mac", detail: "Apple 芯片" },
        { key: "darwin-x64", title: "Mac", detail: "Intel 芯片" },
      ];

      const downloads = document.querySelector("#downloads");
      const versionNode = document.querySelector("#version");

      function formatSize(bytes) {
        if (!Number.isFinite(bytes) || bytes <= 0) return "";
        const units = ["B", "KB", "MB", "GB"];
        let size = bytes;
        let unit = 0;
        while (size >= 1024 && unit < units.length - 1) {
          size /= 1024;
          unit += 1;
        }
        return `${size.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
      }

      async function fileSize(url) {
        try {
          const response = await fetch(url, { method: "HEAD" });
          if (!response.ok) return "";
          return formatSize(Number(response.headers.get("content-length")));
        } catch {
          return "";
        }
      }

      async function thisComputer() {
        const agent = navigator.userAgent || "";
        if (/Windows/i.test(agent)) return "win32-x64";
        if (!/Mac/i.test(agent)) return "";
        try {
          const data = await navigator.userAgentData?.getHighEntropyValues?.(["architecture"]);
          if (data?.architecture === "x86") return "darwin-x64";
        } catch {
          /* 浏览器不提供架构时，Mac 默认推荐 Apple 芯片。 */
        }
        return "darwin-arm64";
      }

      function showMessage(text) {
        downloads.innerHTML = "";
        const note = document.createElement("p");
        note.className = "status";
        note.textContent = text;
        downloads.append(note);
      }

      function render(manifest, recommended) {
        versionNode.innerHTML = "";
        const label = document.createElement("span");
        label.textContent = "当前版本 ";
        versionNode.append(label, document.createTextNode(manifest.version));

        downloads.innerHTML = "";
        for (const edition of editions) {
          const url = manifest.files?.[edition.key];
          if (!url) continue;
          const card = document.createElement("article");
          card.className = "card";
          if (edition.key === recommended) card.classList.add("recommended");

          const title = document.createElement("h2");
          title.textContent = edition.title;
          const detail = document.createElement("p");
          detail.className = "detail";
          detail.textContent = edition.detail;
          const badge = document.createElement("p");
          badge.className = "badge";
          badge.textContent = "适合这台电脑";
          const meta = document.createElement("p");
          meta.className = "meta";
          if (edition.key.startsWith("darwin") && manifest.minimumMacOSVersion) {
            meta.textContent = `需要 macOS ${manifest.minimumMacOSVersion} 或更高版本`;
          }
          const link = document.createElement("a");
          link.className = "download";
          link.href = url;
          link.textContent = "下载";

          card.append(title, detail, badge, meta, link);
          downloads.append(card);

          fileSize(url).then((size) => {
            if (!size) return;
            const requirement = meta.textContent;
            meta.textContent = requirement ? `${size} · ${requirement}` : size;
          });
        }

        if (!downloads.children.length) showMessage("这份版本清单里没有可下载的安装包。");
      }

      downloads.innerHTML = editions
        .map(() => '<article class="card"><div class="skeleton"></div><div class="skeleton wide"></div></article>')
        .join("");

      Promise.all([
        fetch("/goose/latest.json", { cache: "no-store" }).then((response) => {
          if (response.status === 404) return null;
          if (!response.ok) throw new Error(String(response.status));
          return response.json();
        }),
        thisComputer(),
      ])
        .then(([manifest, recommended]) => {
          if (!manifest?.version || !manifest.files) {
            versionNode.textContent = "";
            showMessage("还没有发布版本。构建完成后，这里会自动出现下载。");
            return;
          }
          render(manifest, recommended);
        })
        .catch(() => {
          versionNode.textContent = "";
          showMessage("暂时读不到版本清单。请稍后再打开这个页面。");
        });
    </script>
  </body>
</html>
